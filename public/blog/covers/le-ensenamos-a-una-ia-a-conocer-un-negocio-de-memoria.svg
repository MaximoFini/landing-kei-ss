<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-alfa" cx="50%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#0f2678" />
      <stop offset="35%" stop-color="#091c50" />
      <stop offset="68%" stop-color="#050f28" />
      <stop offset="100%" stop-color="#030816" />
    </radialGradient>
    <pattern id="dots-alfa" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.08" />
    </pattern>
    <radialGradient id="glow-alfa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f7dff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3f7dff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-alfa)" />
  <rect width="1200" height="630" fill="url(#dots-alfa)" />
  <circle cx="600" cy="315" r="260" fill="url(#glow-alfa)" />

  <!-- bot face -->
  <rect x="330" y="220" width="180" height="150" rx="24" fill="#0b1a42" stroke="#3f7dff" stroke-width="3" />
  <line x1="420" y1="220" x2="420" y2="180" stroke="#3f7dff" stroke-width="3" />
  <circle cx="420" cy="170" r="10" fill="#bcdcff" />
  <g fill="#bcdcff">
    <circle cx="385" cy="290" r="12" />
    <circle cx="455" cy="290" r="12" />
  </g>
  <path d="M385 335 q35 20 70 0" stroke="#bcdcff" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- connection to data -->
  <line x1="510" y1="295" x2="700" y2="295" stroke="#bcdcff" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

  <!-- database cylinder -->
  <g fill="#0b1a42" stroke="#bcdcff" stroke-width="2.5">
    <ellipse cx="800" cy="240" rx="80" ry="24" />
    <path d="M720 240 v110 a80 24 0 0 0 160 0 v-110" />
    <ellipse cx="800" cy="350" rx="80" ry="24" opacity="0" />
    <path d="M720 295 a80 24 0 0 0 160 0" fill="none" />
  </g>

  <!-- verified checkmark badge -->
  <circle cx="900" cy="180" r="42" fill="#0b1a42" stroke="#3f7dff" stroke-width="3" />
  <path d="M882 180 l12 14 24 -28" fill="none" stroke="#bcdcff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <g fill="#bcdcff" opacity="0.7">
    <circle cx="260" cy="460" r="5" />
    <circle cx="950" cy="480" r="5" />
    <circle cx="300" cy="150" r="5" />
  </g>
</svg>
