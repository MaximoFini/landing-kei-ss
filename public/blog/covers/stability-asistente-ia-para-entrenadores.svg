<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-stab" cx="50%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#0f2678" />
      <stop offset="35%" stop-color="#091c50" />
      <stop offset="68%" stop-color="#050f28" />
      <stop offset="100%" stop-color="#030816" />
    </radialGradient>
    <pattern id="dots-stab" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.08" />
    </pattern>
    <radialGradient id="glow-stab" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f7dff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3f7dff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-stab)" />
  <rect width="1200" height="630" fill="url(#dots-stab)" />
  <circle cx="600" cy="315" r="260" fill="url(#glow-stab)" />

  <!-- chat bubble -->
  <path d="M300 200 h340 a30 30 0 0 1 30 30 v150 a30 30 0 0 1 -30 30 h-230 l-60 55 v-55 h-50 a30 30 0 0 1 -30 -30 v-150 a30 30 0 0 1 30 -30 z"
        fill="#0b1a42" stroke="#3f7dff" stroke-width="2.5" />

  <!-- progression line chart inside bubble -->
  <polyline points="345,340 410,300 470,320 540,255 600,270 640,215"
            fill="none" stroke="#bcdcff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <g fill="#3f7dff">
    <circle cx="345" cy="340" r="6" />
    <circle cx="410" cy="300" r="6" />
    <circle cx="470" cy="320" r="6" />
    <circle cx="540" cy="255" r="6" />
    <circle cx="600" cy="270" r="6" />
    <circle cx="640" cy="215" r="7" />
  </g>

  <!-- second bubble reply on the right -->
  <path d="M760 380 h130 a22 22 0 0 1 22 22 v70 a22 22 0 0 1 -22 22 h-95 l-45 40 v-40 h-12 a22 22 0 0 1 -22 -22 v-70 a22 22 0 0 1 22 -22 z"
        fill="#0b1a42" stroke="#bcdcff" stroke-width="2" opacity="0.9" />
  <g stroke="#bcdcff" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
    <line x1="790" y1="415" x2="880" y2="415" />
    <line x1="790" y1="440" x2="855" y2="440" />
  </g>

  <!-- small orbiting dots -->
  <g fill="#bcdcff" opacity="0.7">
    <circle cx="250" cy="140" r="5" />
    <circle cx="940" cy="220" r="5" />
    <circle cx="900" cy="500" r="5" />
    <circle cx="220" cy="470" r="5" />
  </g>
</svg>
